name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_FILE: 'AppCanzoniere.slnx'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Install MAUI workload
      run: dotnet workload install maui
    
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
    
    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore
    
    - name: Run unit tests
      run: dotnet test ${{ env.SOLUTION_FILE }} --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --logger trx
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/TestResults/**/*.trx'
    
    - name: Upload code coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage
        path: '**/TestResults/**/*.coverage'

  build-android:
    name: Build Android
    runs-on: windows-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Install MAUI workload
      run: dotnet workload install maui-android
    
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
    
    - name: Build Android APK
      run: dotnet publish src/AppCanzoniere.MAUI/AppCanzoniere.MAUI.csproj -f net10.0-android -c Release -o ./artifacts/android
    
    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: ./artifacts/android/**/*.apk

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Install MAUI workload
      run: dotnet workload install maui-windows
    
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
    
    - name: Build Windows MSIX
      run: dotnet publish src/AppCanzoniere.MAUI/AppCanzoniere.MAUI.csproj -f net10.0-windows10.0.19041.0 -c Release -o ./artifacts/windows
    
    - name: Upload Windows MSIX
      uses: actions/upload-artifact@v4
      with:
        name: windows-msix
        path: ./artifacts/windows/**/*.msix

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Install MAUI workload
      run: dotnet workload install maui-ios
    
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
    
    # Note: Signing requires certificates and provisioning profiles
    # Configure these in GitHub Secrets for production builds
    - name: Build iOS IPA
      run: dotnet build src/AppCanzoniere.MAUI/AppCanzoniere.MAUI.csproj -f net10.0-ios -c Release
    
    - name: Upload iOS build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: ./artifacts/ios/**/*

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Install MAUI workload
      run: dotnet workload install maui-maccatalyst
    
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
    
    - name: Build macOS app
      run: dotnet build src/AppCanzoniere.MAUI/AppCanzoniere.MAUI.csproj -f net10.0-maccatalyst -c Release
    
    - name: Upload macOS build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: ./artifacts/macos/**/*

  build-backend:
    name: Build Backend API
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
    
    - name: Build Backend
      run: dotnet publish src/AppCanzoniere.Backend/AppCanzoniere.Backend.csproj -c Release -o ./artifacts/backend
    
    - name: Upload Backend artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-api
        path: ./artifacts/backend/**/*
