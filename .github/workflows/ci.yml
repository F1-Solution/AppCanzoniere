name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Pinned MAUI workload set (the one CI resolved so far); bump deliberately.
  WORKLOAD_VERSION: 10.0.404

jobs:
  core:
    name: core (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-core-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-core-${{ runner.os }}-

      # Restore fails on vulnerable packages (NU1902-NU1904 are errors, see Directory.Build.props).
      - name: Restore
        run: dotnet restore AppCanzoniere.Core.slnx

      - name: Build
        run: dotnet build AppCanzoniere.Core.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test AppCanzoniere.Core.slnx --configuration Release --no-build
          --logger "trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Check formatting
        run: dotnet format AppCanzoniere.Core.slnx --verify-no-changes --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          if-no-files-found: error

  android:
    name: MAUI Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: microsoft
          java-version: '21'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-android-${{ runner.os }}-

      - name: Install Android workload
        run: dotnet workload install maui-android --version ${{ env.WORKLOAD_VERSION }}

      - name: Build debug APK
        run: >
          dotnet build src/AppCanzoniere.MAUI/AppCanzoniere.MAUI.csproj
          --framework net10.0-android --configuration Debug
          -p:MauiPlatforms=android -p:AndroidPackageFormat=apk -p:EmbedAssembliesIntoApk=true
          -t:Build -t:SignAndroidPackage

      # Every PR: the ML Kit telemetry backend must stay removed from the merged manifest (R10-07).
      - name: Check merged manifest has no telemetry backend
        run: |
          manifest=src/AppCanzoniere.MAUI/obj/Debug/net10.0-android/AndroidManifest.xml
          test -s "$manifest" || { echo "merged manifest not found: $manifest"; exit 1; }
          if grep -Eq 'CctBackendFactory|backend:com.google.android.datatransport' "$manifest"; then
            echo "The datatransport backend is registered again in the merged manifest:"
            grep -En 'CctBackendFactory|backend:com.google.android.datatransport' "$manifest"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: src/AppCanzoniere.MAUI/bin/Debug/net10.0-android/*-Signed.apk
          if-no-files-found: error

  android-emulator:
    name: Android emulator tests
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare output folder
        run: mkdir -p emulator-artifacts

      # Manual runs only: captures the runner uplink (DNS and web ports, headers only) to prove ML Kit sends nothing.
      # The pcap stays on the runner; only the text summary is uploaded because the repository is public.
      - name: Start host capture
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get install -y tcpdump > /dev/null
          sudo tcpdump -i eth0 -U -n -s 600 -w "$RUNNER_TEMP/host.pcap"             'not host 168.63.129.16 and not host 169.254.169.254 and (port 53 or port 80 or port 443)' > /dev/null 2>&1 &
          sleep 2

      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || bash tools/android-network-capture.sh apk/*-Signed.apk emulator-artifacts
            bash tools/android-emulator-tests.sh apk/*-Signed.apk emulator-artifacts

      - name: Summarise network capture
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          sudo pkill tcpdump || true
          sleep 2
          python3 -I tools/android-network-analyze.py "$RUNNER_TEMP/host.pcap" emulator-artifacts/net-markers.txt emulator-artifacts/host-summary.txt emulator-artifacts/net-uid-counters.txt
          ! grep -q firebaselogging emulator-artifacts/host-summary.txt

      - name: Upload screenshots and logcat
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-results
          path: emulator-artifacts
          if-no-files-found: warn

  windows:
    name: MAUI Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-windows-${{ runner.os }}-

      - name: Install Windows workload
        run: dotnet workload install maui-windows --version ${{ env.WORKLOAD_VERSION }}

      - name: Check MAUI formatting
        run: dotnet format whitespace src/AppCanzoniere.MAUI/AppCanzoniere.MAUI.csproj --verify-no-changes

      - name: Build
        run: >
          dotnet build src/AppCanzoniere.MAUI/AppCanzoniere.MAUI.csproj
          --framework net10.0-windows10.0.19041.0 --configuration Debug
          -p:MauiPlatforms=windows

      - name: Job Object tests
        run: dotnet test tests/AppCanzoniere.Infrastructure.Tests --filter "FullyQualifiedName~PdfImport"

      # The reader must also be part of `dotnet publish` output, not only of the build output.
      - name: Publish Release
        run: >
          dotnet publish src/AppCanzoniere.MAUI/AppCanzoniere.MAUI.csproj
          --framework net10.0-windows10.0.19041.0 --configuration Release
          -p:MauiPlatforms=windows --output publish

      - name: PDF reader package tests on the published app
        env:
          APPCANZONIERE_APP_DIR: ${{ github.workspace }}\publish
        run: dotnet test tests/AppCanzoniere.Windows.UiTests --configuration Debug --filter "FullyQualifiedName~PdfWorkerPackageTests"

      # Launches the built app on the runner's interactive desktop; also checks the PDF reader ships in the output.
      - name: Windows app UI tests
        run: dotnet test tests/AppCanzoniere.Windows.UiTests --configuration Debug

      - name: Upload Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-debug-build
          path: src/AppCanzoniere.MAUI/bin/Debug/net10.0-windows10.0.19041.0/win-x64/
          if-no-files-found: error
